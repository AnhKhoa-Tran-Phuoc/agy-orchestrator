[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agy-orchestrator"
version = "0.1.0"
description = "MCP Server & CLI allowing ChatGPT / Codex to orchestrate Google Antigravity CLI models as quota-saving workers."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [
    { name = "KokaTran98", email = "kokatran98@gmail.com" }
]
dependencies = [
    "mcp>=1.6.0",
    "tomli-w>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[project.scripts]
agy-orch = "agy_orchestrator.cli:main"
agy-orch-mcp = "agy_orchestrator.mcp_server:run_stdio"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
